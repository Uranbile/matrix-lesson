<!doctype html><html lang="mn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мөр, баганын болзоо</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6fc;color:#17243b;text-align:center;margin:0;padding:4vh 3vw}h1{font-size:clamp(24px,4vw,60px);margin:0}p{font-size:clamp(16px,2vw,28px)}main{display:flex;align-items:center;justify-content:center;gap:2vw;flex-wrap:wrap;margin:5vh auto}.matrix{display:grid;gap:6px;border-left:4px solid;border-right:4px solid;border-radius:8px;padding:10px}.cell{width:clamp(45px,6vw,100px);height:clamp(45px,6vw,100px);display:grid;place-items:center;font-size:clamp(24px,3vw,48px);border:0;border-radius:10px;background:#e4eaf3;color:#17243b}.blue{background:#bfdbfe;color:#1d4ed8}.yellow{background:#fde68a;color:#92400e}.green{background:#bbf7d0;color:#166534}button{cursor:pointer;font:inherit}input.cell{text-align:center;min-width:0}button.cell{border:2px solid #9caec5}.op{font-size:4vw}#formula{font-size:clamp(22px,3vw,48px);background:white;padding:25px;border-radius:16px;margin:3vh auto;max-width:1100px}nav button{padding:12px 20px;border:0;border-radius:8px;background:#253c65;color:white;margin:5px}h2{font-size:clamp(16px,2vw,28px)}small{display:block;margin-top:20px}</style><h1>МӨР, БАГАНЫН БОЛЗОО</h1><p>Үр дүнгийн матрицын нүдийг сонгоорой.</p><main><section><h2>A · 2 × 3</h2><div class="matrix" id="a" style="grid-template-columns:repeat(3,1fr)"></div></section><span class="op">×</span><section><h2>B · 3 × 2</h2><div class="matrix" id="b" style="grid-template-columns:repeat(2,1fr)"></div></section><span class="op">=</span><section><h2>AB · 2 × 2</h2><div class="matrix" id="c" style="grid-template-columns:repeat(2,1fr)"></div></section></main><div id="formula"></div><nav><button onclick="step()">Дараагийн нүд →</button><button onclick="reset()">Анхны жишээ</button><button onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">Бүтэн дэлгэц</button></nav><small>А, B матрицын тоонуудыг өөрчилж болно.</small><script>let A,B,i=0,j=0;const a=document.getElementById('a'),b=document.getElementById('b'),c=document.getElementById('c');function reset(){A=[[2,3,1],[4,1,2]];B=[[1,2],[3,1],[2,4]];i=j=0;build()}function build(){for(const [M,el] of [[A,a],[B,b]]){el.innerHTML='';M.forEach((r,x)=>r.forEach((v,y)=>{let e=document.createElement('input');e.type='number';e.className='cell';e.value=v;e.oninput=()=>{M[x][y]=Number(e.value);paint()};el.append(e)}))}paint()}function paint(){[...a.children].forEach((e,k)=>e.className='cell '+(Math.floor(k/3)===i?'blue':''));[...b.children].forEach((e,k)=>e.className='cell '+(k%2===j?'yellow':''));c.innerHTML='';A.forEach((r,x)=>B[0].forEach((_,y)=>{let e=document.createElement('button');e.className='cell '+(x===i&&y===j?'green':'');e.textContent=r.reduce((s,v,k)=>s+v*B[k][y],0);e.onclick=()=>{i=x;j=y;paint()};c.append(e)}));document.getElementById('formula').textContent='c'+['₁','₂'][i]+['₁','₂'][j]+' = '+A[i].map((v,k)=>`(${v} × ${B[k][j]})`).join(' + ')+' = '+A[i].reduce((s,v,k)=>s+v*B[k][j],0)}function step(){let n=(i*2+j+1)%4;i=Math.floor(n/2);j=n%2;paint()}reset()</script></html>
